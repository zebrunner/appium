---
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # the reusable lint job of mcloud-conventions (CONVENTIONS.md)
  lint:
    uses: zebrunner/mcloud-conventions/.github/workflows/lint.yml@v1

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Tests without docker (make test)
        run: make test
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Tests report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: tests report
          annotate_only: true
          detailed_summary: true
          require_tests: true

  # the image of the docker tests, built once (as build_image of tests/docker_lib.sh) and passed to the jobs of `docker`
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: zbr-appium:ci
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --progress=plain --platform linux/amd64 --provenance=false --target appium --tag "$IMAGE" .
      - name: Save the image
        run: docker save "$IMAGE" | zstd -T0 -3 -q -o "${RUNNER_TEMP}/image.tar.zst"
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 1

  # the docker tests in parallel on the image of `build`: image checks, the tests of the Appium patch, end-to-end
  # tests with a fake device
  docker:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test: [image, patch, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: zbr-appium:ci
      SKIP_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: zstd -dc "${RUNNER_TEMP}/image.tar.zst" | docker load --quiet
      - name: Docker tests (make ${{ matrix.test }})
        run: tests/${{ matrix.test }}_test.sh
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Docker report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: docker report (${{ matrix.test }})
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-docker-${{ matrix.test }}
          path: ${{ runner.temp }}/junit/

  patch-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The js files of the patch are the build of the patch diff
        run: tests/patch_sync_test.sh
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Patch sync report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: patch sync report
          annotate_only: true
          detailed_summary: true
          require_tests: true

  # the image of a merge into develop to public.ecr.aws after all the checks (CONVENTIONS.md#versions)
  publish:
    needs: [lint, tests, docker, patch-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: zebrunner/mcloud-conventions/.github/workflows/docker-publish.yml@v1
